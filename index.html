<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badshah Ka Wazir - Online Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101827;color:#f8fafc;font-family:Arial,sans-serif}
.container{max-width:760px;margin:auto}
h1{text-align:center;color:#facc15;margin:12px 0}
.subtitle{text-align:center;color:#cbd5e1;margin-bottom:22px}
.panel{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:18px;margin:14px 0}
input{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #64748b;background:#0f172a;color:white;font-size:16px}
button{border:0;border-radius:8px;padding:13px 16px;margin:5px 3px;cursor:pointer;font-size:15px;font-weight:bold;background:#eab308;color:#111827}
button:disabled{opacity:.45;cursor:not-allowed}
.full{width:100%;margin:7px 0}
.secondary{background:#475569;color:white}
.hidden{display:none!important}
.status{color:#93c5fd;font-weight:bold}
.muted{color:#cbd5e1}
.player{display:flex;justify-content:space-between;gap:10px;padding:12px;margin:7px 0;background:#0f172a;border-radius:8px}
.card{background:#334155;padding:18px;border-radius:12px;text-align:center;margin:8px 0}
.role{color:#facc15;font-size:26px;font-weight:bold}
.points{color:#86efac;font-weight:bold}
.option{width:100%;background:#2563eb;color:white;margin:8px 0}
.error{color:#fca5a5;white-space:pre-wrap}
.success{color:#86efac}
hr{border:0;border-top:1px solid #475569;margin:18px 0}
@media(max-width:480px){body{padding:10px}.panel{padding:13px}}
</style>
</head>
<body>
<div class="container">
<h1>👑 BADSHAH KA WAZIR</h1>
<div class="subtitle">Online Multiplayer Game</div>

<section id="loginPanel" class="panel">
<h2>Enter Game</h2>
<input id="playerName" maxlength="20" placeholder="Enter your name">
<button id="createBtn" class="full">Create New Room</button>
<hr>
<input id="roomCodeInput" maxlength="6" placeholder="Enter 6-character room code">
<button id="joinBtn" class="full secondary">Join Room</button>
<p id="loginMessage" class="error"></p>
</section>

<section id="gamePanel" class="hidden">
<div class="panel">
<div>Room Code: <strong id="roomCodeLabel"></strong></div>
<p class="muted">Share this code with the other three players.</p>
<div id="gameStatus" class="status">Connecting...</div>
</div>

<div class="panel">
<h2>Players & Scores</h2>
<div id="playersList"></div>
</div>

<div class="panel">
<h2>Your Role</h2>
<div id="roleArea" class="card">Waiting for the round to start.</div>
<div id="wazirArea" class="hidden">
<h3>Wazir: Identify the Chor</h3>
<p class="muted">Select one of these two players.</p>
<div id="wazirOptions"></div>
</div>
<div id="revealArea" class="hidden">
<h3>Round Result</h3>
<div id="revealList"></div>
</div>
</div>

<div class="panel">
<h2>Host Controls</h2>
<button id="startBtn" class="full hidden">Start Round</button>
<p id="hostMessage" class="muted"></p>
</div>
<p id="gameMessage" class="error"></p>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {
  getDatabase, ref, get, set, update, onValue
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOB_Wq2W__OGB9TPbi67MsjFi4w4lQgXg",
  authDomain: "badshah-ka-wazir.firebaseapp.com",
  databaseURL: "https://badshah-ka-wazir-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "badshah-ka-wazir",
  storageBucket: "badshah-ka-wazir.firebasestorage.app",
  messagingSenderId: "864364063528",
  appId: "1:864364063528:web:70e36982d4936b74773e1d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let uid = null;
let roomCode = null;
let roomData = { members: {}, public: {}, host: null };
let myPrivate = null;
let processingRound = false;
let listenersStarted = false;

const $ = id => document.getElementById(id);
const roomPath = () => `rooms/${roomCode}`;

const authReady = signInAnonymously(auth).then(result => {
  uid = result.user.uid;
  return uid;
});

function message(id, text) {
  $(id).textContent = text || "";
}

function cleanName(value) {
  return value.trim().replace(/\s+/g, " ").slice(0, 20);
}

function makeCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 6; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}

function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

async function createRoom() {
  message("loginMessage", "");
  const name = cleanName($("playerName").value);
  if (!name) {
    message("loginMessage", "Please enter your name.");
    return;
  }

  $("createBtn").disabled = true;

  try {
    await authReady;

    let code = null;
    for (let i = 0; i < 10; i++) {
      const candidate = makeCode();
      const existing = await get(ref(db, `rooms/${candidate}/public`));
      if (!existing.exists()) {
        code = candidate;
        break;
      }
    }
    if (!code) throw new Error("Could not create a room. Please try again.");

    await set(ref(db, `rooms/${code}`), {
      host: uid,
      members: {
        [uid]: { name, score: 0 }
      },
      public: {
        round: 0,
        phase: "lobby",
        guess: null,
        revealedRoles: null
      },
      private: {}
    });

    enterRoom(code);
  } catch (error) {
    message("loginMessage", error.message);
  } finally {
    $("createBtn").disabled = false;
  }
}

async function joinRoom() {
  message("loginMessage", "");
  const name = cleanName($("playerName").value);
  const code = $("roomCodeInput").value.trim().toUpperCase();

  if (!name) {
    message("loginMessage", "Please enter your name.");
    return;
  }
  if (!/^[A-Z0-9]{6}$/.test(code)) {
    message("loginMessage", "Please enter a valid 6-character room code.");
    return;
  }

  $("joinBtn").disabled = true;

  try {
    await authReady;

    const publicSnap = await get(ref(db, `rooms/${code}/public`));
    if (!publicSnap.exists()) throw new Error("Room not found.");

    const publicData = publicSnap.val();
    if (publicData.phase !== "lobby") {
      throw new Error("This game has already started.");
    }

    const membersSnap = await get(ref(db, `rooms/${code}/members`));
    const members = membersSnap.val() || {};

    if (members[uid]) {
      enterRoom(code);
      return;
    }

    const players = Object.entries(members);
    if (players.length >= 4) throw new Error("Room is full.");

    if (players.some(([, p]) => (p.name || "").toLowerCase() === name.toLowerCase())) {
      throw new Error("This name is already being used in this room.");
    }

    await set(ref(db, `rooms/${code}/members/${uid}`), {
      name,
      score: 0
    });

    enterRoom(code);
  } catch (error) {
    message("loginMessage", error.message);
  } finally {
    $("joinBtn").disabled = false;
  }
}

function enterRoom(code) {
  if (listenersStarted) return;
  listenersStarted = true;
  roomCode = code;

  $("loginPanel").classList.add("hidden");
  $("gamePanel").classList.remove("hidden");
  $("roomCodeLabel").textContent = code;

  onValue(ref(db, `${roomPath()}/host`), snap => {
    roomData.host = snap.val();
    render();
  });

  onValue(ref(db, `${roomPath()}/members`), snap => {
    roomData.members = snap.val() || {};
    render();
  });

  onValue(ref(db, `${roomPath()}/public`), async snap => {
    roomData.public = snap.val() || {};
    render();

    if (
      roomData.host === uid &&
      roomData.public.phase === "guessing" &&
      roomData.public.guess &&
      !processingRound
    ) {
      await finishRound();
    }
  });

  onValue(ref(db, `${roomPath()}/private/${uid}`), snap => {
    myPrivate = snap.val();
    render();
  });
}

function render() {
  const members = roomData.members || {};
  const pub = roomData.public || {};
  const players = Object.entries(members);
  const isHost = roomData.host === uid;

  $("gameStatus").textContent =
    `Round ${pub.round || 0} — ${pub.phase || "lobby"}`;

  $("playersList").innerHTML = "";
  players.forEach(([id, player]) => {
    const row = document.createElement("div");
    row.className = "player";

    const playerName = document.createElement("span");
    playerName.textContent = player.name + (id === roomData.host ? " 👑 Host" : "");

    const playerScore = document.createElement("strong");
    playerScore.className = "points";
    playerScore.textContent = `${Number(player.score || 0)} points`;

    row.append(playerName, playerScore);
    $("playersList").appendChild(row);
  });

  $("startBtn").classList.toggle("hidden", !isHost);
  $("startBtn").disabled =
    players.length !== 4 || !["lobby", "reveal"].includes(pub.phase);

  $("hostMessage").textContent = isHost
    ? `Players joined: ${players.length}/4`
    : "Waiting for the Host.";

  $("wazirArea").classList.add("hidden");
  $("revealArea").classList.add("hidden");
  $("roleArea").textContent = "";

  if (pub.phase === "lobby") {
    $("roleArea").textContent = "Waiting for the Host to start the round.";
    return;
  }

  if (pub.phase === "guessing") {
    if (!myPrivate || !myPrivate.role) {
      $("roleArea").textContent = "Loading your role...";
      return;
    }

    const role = document.createElement("div");
    role.className = "role";
    role.textContent = myPrivate.role;
    $("roleArea").appendChild(role);

    if (myPrivate.role === "Badshah") {
      $("roleArea").append(" You are the Badshah. Wait for the Wazir.");
    } else if (myPrivate.role === "Wazir") {
      $("wazirArea").classList.remove("hidden");
      renderOptions(myPrivate.options || [], pub.guess);
    } else {
      $("roleArea").append(" Your role is private until the round ends.");
    }
    return;
  }

  if (pub.phase === "reveal") {
    $("roleArea").textContent = "Round completed. All roles have been revealed.";
    $("revealArea").classList.remove("hidden");
    $("revealList").innerHTML = "";

    Object.entries(pub.revealedRoles || {}).forEach(([id, item]) => {
      const row = document.createElement("div");
      row.className = "player";

      const name = document.createElement("span");
      name.textContent = item.name;

      const role = document.createElement("strong");
      role.textContent = item.role;

      row.append(name, role);
      $("revealList").appendChild(row);
    });

    if (pub.guess) {
      const result = document.createElement("p");
      result.className = "points";
      result.textContent = pub.guess.correct
        ? "Correct! Wazir receives 500 points."
        : "Incorrect! Chor receives 500 points.";
      $("revealList").appendChild(result);
    }
  }
}

function renderOptions(options, guess) {
  $("wazirOptions").innerHTML = "";

  if (guess) {
    $("wazirOptions").textContent = "Your choice has been submitted. Waiting for the result.";
    return;
  }

  options.forEach(option => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = option.name;
    button.addEventListener("click", () => submitGuess(option.uid));
    $("wazirOptions").appendChild(button);
  });
}

async function startRound() {
  message("gameMessage", "");

  if (roomData.host !== uid) return;

  const members = roomData.members || {};
  const players = Object.entries(members);

  if (players.length !== 4) {
    message("gameMessage", "Exactly four players are required.");
    return;
  }

  const names = players.map(([, p]) => (p.name || "").toLowerCase());
  if (new Set(names).size !== 4) {
    message("gameMessage", "All four player names must be different.");
    return;
  }

  $("startBtn").disabled = true;

  try {
    const shuffled = shuffle(players);
    const roles = ["Badshah", "Wazir", "Sipahi", "Chor"];
    const assignments = {};

    shuffled.forEach(([id], index) => {
      assignments[id] = roles[index];
    });

    const privateData = {};
    players.forEach(([id]) => {
      privateData[id] = { role: assignments[id] };
    });

    const wazirId = Object.keys(assignments).find(id => assignments[id] === "Wazir");
    const sipahiId = Object.keys(assignments).find(id => assignments[id] === "Sipahi");
    const chorId = Object.keys(assignments).find(id => assignments[id] === "Chor");

    privateData[wazirId].options = shuffle([
      { uid: sipahiId, name: members[sipahiId].name },
      { uid: chorId, name: members[chorId].name }
    ]);

    await set(ref(db, `${roomPath()}/private`), privateData);

    await update(ref(db, `${roomPath()}/public`), {
      round: Number(roomData.public.round || 0) + 1,
      phase: "guessing",
      guess: null,
      revealedRoles: null
    });

    message("gameMessage", "Round started.");
  } catch (error) {
    message("gameMessage", "Could not start round: " + error.message);
  } finally {
    $("startBtn").disabled = false;
  }
}

async function submitGuess(selectedUid) {
  if (roomData.public.phase !== "guessing" || myPrivate?.role !== "Wazir") return;
  if (roomData.public.guess) return;

  try {
    await set(ref(db, `${roomPath()}/public/guess`), {
      by: uid,
      selectedUid
    });
    message("gameMessage", "Your selection has been submitted.");
  } catch (error) {
    message("gameMessage", "Could not submit selection: " + error.message);
  }
}

async function finishRound() {
  if (processingRound) return;
  processingRound = true;

  try {
    const [membersSnap, publicSnap] = await Promise.all([
      get(ref(db, `${roomPath()}/members`)),
      get(ref(db, `${roomPath()}/public`))
    ]);

    const members = membersSnap.val() || {};
    const pub = publicSnap.val() || {};
    const guess = pub.guess;

    if (pub.phase !== "guessing" || !guess?.selectedUid) return;

    const privateEntries = await Promise.all(
      Object.keys(members).map(async id => {
        const snap = await get(ref(db, `${roomPath()}/private/${id}`));
        return [id, snap.val() || {}];
      })
    );

    const privateData = Object.fromEntries(privateEntries);
    const roles = {};

    Object.entries(privateData).forEach(([id, data]) => {
      roles[id] = data.role;
    });

    const wazirId = Object.keys(roles).find(id => roles[id] === "Wazir");
    const chorId = Object.keys(roles).find(id => roles[id] === "Chor");

    if (!wazirId || !chorId || guess.by !== wazirId) {
      throw new Error("Invalid Wazir selection or missing role data.");
    }

    const correct = guess.selectedUid === chorId;
    const updatedMembers = {};

    Object.entries(members).forEach(([id, player]) => {
      let score = Number(player.score || 0);

      if (roles[id] === "Badshah") score += 1000;
      if (roles[id] === "Sipahi") score += 300;
      if (roles[id] === "Wazir" && correct) score += 500;
      if (roles[id] === "Chor" && !correct) score += 500;

      updatedMembers[id] = { ...player, score };
    });

    const revealedRoles = {};
    Object.entries(roles).forEach(([id, role]) => {
      revealedRoles[id] = {
        name: members[id]?.name || "Player",
        role
      };
    });

    await update(ref(db, roomPath()), {
      members: updatedMembers,
      public: {
        ...pub,
        phase: "reveal",
        guess: {
          ...guess,
          correct,
          selectedName: members[guess.selectedUid]?.name || "Unknown"
        },
        revealedRoles
      }
    });
  } catch (error) {
    message("gameMessage", "Round result error: " + error.message);
  } finally {
    processingRound = false;
  }
}

$("createBtn").addEventListener("click", createRoom);
$("joinBtn").addEventListener("click", joinRoom);
$("startBtn").addEventListener("click", startRound);

authReady.catch(error => {
  message("loginMessage", "Firebase sign-in error: " + error.message);
});
</script>
</body>
</html>
